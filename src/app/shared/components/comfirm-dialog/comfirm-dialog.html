<!-- confirm-dialog.component.html -->
<!-- Overlay -->
<div class="fixed inset-0 bg-black/50 flex items-center
            justify-center z-50 px-4">

  <!-- Carte -->
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm
              border border-gray-100">

    <!-- Icône selon le type -->
    <div class="flex justify-center mb-4">
      <div class="rounded-full p-3
                  {{type === 'danger'  ? 'bg-red-100'    :
                    type === 'warning' ? 'bg-amber-100'  :
                                        'bg-blue-100'}}">
        @if (type === 'danger') {
          <svg xmlns="http://www.w3.org/2000/svg"
               class="h-8 w-8 text-red-500"
               fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138
                     21H7.862a2 2 0 01-1.995-1.858L5 7m5
                     4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1
                     1 0 00-1 1v3M4 7h16"/>
          </svg>
        }
        @if (type === 'warning') {
          <svg xmlns="http://www.w3.org/2000/svg"
               class="h-8 w-8 text-amber-500"
               fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856
                     c1.54 0 2.502-1.667 1.732-3L13.732
                     4c-.77-1.333-2.694-1.333-3.464 0L3.34
                     16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        }
        @if (type === 'info') {
          <svg xmlns="http://www.w3.org/2000/svg"
               class="h-8 w-8 text-blue-500"
               fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21
                     12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        }
      </div>
    </div>

    <!-- Titre -->
    <h3 class="text-lg font-bold text-gray-800 text-center mb-2">
      {{ title }}
    </h3>

    <!-- Message -->
    <p class="text-gray-500 text-sm text-center mb-6">
      {{ message }}
    </p>

    <!-- Boutons -->
    <div class="flex gap-3">

      <!-- Annuler -->
      <button
        (click)="onCancel()"
        class="flex-1 bg-gray-100 hover:bg-gray-200
               text-gray-700 font-medium py-2.5 rounded-xl
               transition duration-200 text-sm">
        {{ cancelLabel }}
      </button>

      <!-- Confirmer -->
      <button
        (click)="onConfirm()"
        class="flex-1 text-white font-medium py-2.5 rounded-xl
               transition duration-200 text-sm
               {{type === 'danger'  ? 'bg-red-500 hover:bg-red-600'    :
                 type === 'warning' ? 'bg-amber-500 hover:bg-amber-600' :
                                     'bg-blue-500 hover:bg-blue-600'}}">
        {{ confirmLabel }}
      </button>

    </div>
  </div>
</div>
