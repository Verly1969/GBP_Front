<header class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 shadow-lg">
    <div class="max-w-7x1 mx-auto px-6 py-4 flex items-center gap-3 justify-between">

        <!-- Icone générée par IA Claude -->
        <div class="bg-white/20 rounded-lg p-2">
            <svg 
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-white cursor-pointer"
                fill="none"
                viewbox="0 0 24 24"
                stroke="currentColor"
                (click)="returnAccueil()"
            >
                <path 
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2
                       3 .895 3 2-1.343 2-3 2m0-8c1.11 0
                       2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1
                       c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0
                       11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <!-- Texte -->
        <div>
            <h1 class="text-white font-bold text-xl">GBP</h1>
            <p class="text-blue-100 text-xs">Gestion Budget Personnel</p>
        </div>
        <div>
            
            <!-- Bouton Connexion / Déconnexion -->
            @if (isLoggedIn()) {
            <button
                (click)="logout()"
                class="flex items-center gap-2 bg-white/20 hover:bg-white/30
                    text-white text-sm font-medium px-4 py-2 rounded-xl
                    transition duration-200 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3
                        3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0
                        013-3h4a3 3 0 013 3v1"/>
                </svg>
                Déconnexion
            </button>
            } @else {
            <button
                (click)="login()"
                class="flex items-center gap-2 bg-white/20 hover:bg-white/30
                    text-white text-sm font-medium px-4 py-2 rounded-xl
                    transition duration-200 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 16l-4-4m0 0l4-4m-4 4h14m-5
                        4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3
                        3 0 013-3h7a3 3 0 013 3v1"/>
                </svg>
                Connexion
            </button>
            }
        </div>
    </div>
    
</header>
