<aside class="left-0 top-[76px] w-64 h-[100vh]]
              bg-transparent
              flex flex-col py-6 z-50">

    <div class="flex flex-col items-center gap-3 px-5 pb-5">

        <!-- Nom + Rôle -->
        <div class="text-center">
            <p class="text-base font-semibold text-gray-100">
                {{ authService.currentUser()?.firstName }}
                {{ authService.currentUser()?.lastName }}
            </p>
            <span
                class="text-sm font-semibold px-2 py-0.5 rounded-full font-mono"
                [ngClass]="{
                    'bg-red-500/15 text-red-400 border border-red-500/30'  : authService.currentUser()?.role === 'Admin',
                    'bg-blue-500/15 text-blue-400 border border-blue-500/30': authService.currentUser()?.role === 'User'
                }">
                {{ authService.currentUser()?.role }}
            </span>
        </div>

        <hr class="border-gray-800 mx-4" />

        <!-- Navigation -->
        <nav class="flex overflow-y-auto px-3 py-4">
            <ul class="flex flex-col gap-1">
                @for (item of sidebarService.navItems(); track item.route) {
                    <li>
                        <a
                            [routerLink]="item.route"
                            routerLinkActive="active-link"
                            class="flex items-center gap-3 px-3 py-3 rounded-xl
                                text-black hover:text-gray-100 hover:border hover:border-blue-500
                                hover:bg-white/5 transition-all duration-300
                                text-base font-medium no-underline">
                        
                            <span class="text-lg">{{ item.icon }}</span>
                            <span>{{ item.label }}</span>
                        </a>
                    </li>
                }
            </ul>
        </nav>
    </div>

</aside>
