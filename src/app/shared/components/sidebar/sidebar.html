<aside class="fixed left-0 top-[76px] w-64 h-[calc(100vh-76px)]
              bg-gray-900 border-r border-gray-800
              flex flex-col py-6 z-50">

    <div class="flex items-center gap-3 px-5 pb-5">

        <!-- Nom + Rôle -->
        <div>
            <p class="text-sm font-semibold text-gray-100">
                {{ authService.currentUser()?.firstName }}
                {{ authService.currentUser()?.lastName }}
            </p>
            <span
                class="text-xs font-semibold px-2 py-0.5 rounded-full font-mono"
                [ngClass]="{
                    'bg-red-500/15 text-red-400 border border-red-500/30'  : authService.currentUser()?.role === 'Admin',
                    'bg-blue-500/15 text-blue-400 border border-blue-500/30': authService.currentUser()?.role === 'User'
                }">
                {{ authService.currentUser()?.role }}
            </span>
        </div>

        <hr class="border-gray-800 mx-4" />

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto px-3 py-4">
            <ul class="flex flex-col gap-1">
                @for (item of sidebarService.navItems(); track item.route) {
                    <li>
                        <a
                            [routerLink]="item.route"
                            routerLinkActive="active-link"
                            class="flex items-center gap-3 px-3 py-2.5 rounded-xl
                                text-gray-500 hover:text-gray-100
                                hover:bg-white/5 transition-all duration-200
                                text-sm font-medium no-underline">
                        
                            <span class="text-lg">{{ item.icon }}</span>
                            <span>{{ item.label }}</span>
                        </a>
                    </li>
                }
            </ul>
        </nav>
    </div>

</aside>
