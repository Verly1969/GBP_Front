<div class="h-full bg-gray-500
                flex flex-col items-center pt-4 px-4">
    <div class="bg-gray-100 rounded-2xl shadow-xl p-8 w-full max-w-xl border border-2 border-gray-500 opacity-95">

        <!-- titre -->
        <div class="text-center mb-8">
            <h2 class="text-2x1 font-bold text-gray-800">Modification Email</h2>
        </div>

        <!-- Formulaire -->
        <form class="space-y-5">
        
            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
                    Votre ancienne adresse E-mail:
                </label>
                <input 
                    id="email"
                    type="text"
                    value="admin@example.mail"
                    placeholder="Votre adresse E-mail ..."
                    formControlName="email"
                    class="w-full px-4 py-2.5 border rounded-xl text-sm outline-none
                        transition duration-200 focus:ring-2 focus:ring-blue-500
                        focus:border-transparent placeholder:text-gray-400
                        border-gray-300 hover:border-gray-400"
                />
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
                    Votre nouvelle adresse E-mail:
                </label>
                <input 
                    id="email"
                    type="text"
                    placeholder="Votre adresse E-mail ..."
                    formControlName="email"
                    class="w-full px-4 py-2.5 border rounded-xl text-sm outline-none
                        transition duration-200 focus:ring-2 focus:ring-blue-500
                        focus:border-transparent placeholder:text-gray-400
                        border-gray-300 hover:border-gray-400"
                />
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
                    Confirmation adresse E-mail:
                </label>
                <input 
                    id="email"
                    type="text"
                    placeholder="Votre adresse E-mail ..."
                    formControlName="email"
                    class="w-full px-4 py-2.5 border rounded-xl text-sm outline-none
                        transition duration-200 focus:ring-2 focus:ring-blue-500
                        focus:border-transparent placeholder:text-gray-400
                        border-gray-300 hover:border-gray-400"
                />
            </div>

            <!-- Bouton de connexion -->
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600
                    hover:from-blue-700 hover:to-indigo-700 cursor-pointer
                    disabled:opacity-50 disabled:cursor-not-allowed 
                    text-white font-medium py-2.5 rounded-xl
                    transition duration-200 text-sm mt-2 shadow-md">
                <!-- @if (isLoading()) {
                    Connexion en cours...
                } @else {
                    Se connecter
                } -->
                Sauvegarder
            </button>
        </form>
    </div>
</div>
