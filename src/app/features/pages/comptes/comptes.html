<div class="h-[calc(100vh-76px)] bg-gray-500
                flex flex-col items-center pt-4 px-4">
    <div class="bg-gray-100 rounded-2xl shadow-xl p-8 w-full max-w-4xl 
                border border-2 border-gray-500 opacity-95 flex flex-col items-center">

        <!-- titre -->
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Liste des comptes financiers</h2>
        </div>

        <!-- Tableau - Liste des comptes -->
        <div>
            <table class="table-auto border-separate rounded-xl border-spacing-1 p-4 border border-gray-500 bg-blue-200">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="border border-gray-300 px-4 py-2">N° IBAN</th>
                        <th class="border border-gray-300 px-4 py-2">Organisme</th>
                        <th class="border border-gray-300 px-4 py-2">Solde</th>
                        <th class="border border-gray-300 px-4 py-2" colspan="2">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="bg-gray-200 hover:bg-gray-500">
                        <td class="border border-gray-300 px-4 py-2 cursor-not-allowed">BE12 1234 1234 1234</td>
                        <td class="border border-gray-300 px-4 py-2 cursor-not-allowed text-center">Banque du soleil</td>
                        <td class="border border-gray-300 px-4 py-2 cursor-not-allowed text-right">12.523,32 €</td>
                        <td class="border border-gray-300 bg-blue-500 px-4 py-2 cursor-pointer" title="____Modifier">✒️</td>
                        <td class="border border-gray-300 bg-red-500 px-4 py-2 cursor-pointer" title="____Supprimer">🗑️</td>
                    </tr>
                    <tr class="bg-gray-200 hover:bg-gray-500">
                        <td class="border border-gray-300 px-4 py-2 cursor-not-allowed">BE43 4321 4321 4321</td>
                        <td class="border border-gray-300 px-4 py-2 cursor-not-allowed text-center">Banque de la mer</td>
                        <td class="border border-gray-300 px-4 py-2 cursor-not-allowed text-right">522,25 €</td>
                        <td class="border border-gray-300 bg-blue-500 px-4 py-2 cursor-pointer" title="____Modifier">✒️</td>
                        <td class="border border-gray-300 bg-red-500 px-4 py-2 cursor-pointer" title="____Supprimer">🗑️</td>
                    </tr>
                    <tr class="bg-gray-200 hover:bg-gray-500">
                        <td class="border border-gray-300 px-4 py-2 cursor-not-allowed">BE34 4321 1234 4312</td>
                        <td class="border border-gray-300 px-4 py-2 cursor-not-allowed text-center">Banque de la plage</td>
                        <td class="border border-gray-300 px-4 py-2 cursor-not-allowed text-right">1.082,25 €</td>
                        <td class="border border-gray-300 bg-blue-500 px-4 py-2 cursor-pointer" title="____Modifier">✒️</td>
                        <td class="border border-gray-300 bg-red-500 px-4 py-2 cursor-pointer" title="____Supprimer">🗑️</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Bouton ajout nouveau compte -->
        <div>
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600
                    hover:from-blue-700 hover:to-indigo-700 cursor-pointer
                    disabled:opacity-50 disabled:cursor-not-allowed 
                    text-white font-medium py-2.5 px-4 mt-8 rounded-xl
                    transition duration-200 text-sm mt-2 shadow-md">
                Ajouter un nouveau compte
            </button>
        </div>
    </div>
</div>
